# Keeps the crew working when nobody is watching. Every 5 minutes: one full tick, then the
# scalper every 30 seconds for the rest of the window (it needs fast price checks for its exits).
# The endpoints skip work that is not due, and a Redis lock prevents overlapping runs.
name: tick

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: tick
  cancel-in-progress: false

jobs:
  # Reads the Following timeline of a dedicated X account in a headless Chrome (cookies from the
  # X_AUTH_TOKEN / X_CT0 secrets) and sends new posts to the news radar every minute.
  x-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      SITE: https://agent-house-pied.vercel.app
      TICK_SECRET: ${{ secrets.TICK_SECRET }}
      X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
      X_CT0: ${{ secrets.X_CT0 }}
    steps:
      - uses: actions/checkout@v4
      - name: Install playwright-core (uses the runner's Chrome)
        run: mkdir -p /tmp/xw && cp scripts/x-watch.mjs /tmp/xw/ && cd /tmp/xw && npm init -y >/dev/null && npm install --no-audit --no-fund playwright-core@1.49.1
      - name: Watch X for about 4.5 minutes
        run: node /tmp/xw/x-watch.mjs

  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      SITE: https://agent-house-pied.vercel.app
      TICK_SECRET: ${{ secrets.TICK_SECRET }}
    steps:
      - name: Full tick
        run: curl -sS -m 150 -X POST "$SITE/api/tick${TICK_SECRET:+?secret=$TICK_SECRET}" | head -c 400; echo
      - name: Scalper loop (about 4.5 minutes, every 15 seconds)
        run: |
          for i in $(seq 1 18); do
            curl -sS -m 60 -X POST "$SITE/api/scalp" | head -c 300; echo
            # a full tick every minute so a hot post on the radar becomes a flash sprint quickly
            if [ $((i % 4)) -eq 0 ]; then curl -sS -m 150 -X POST "$SITE/api/tick${TICK_SECRET:+?secret=$TICK_SECRET}" | head -c 200; echo; fi
            sleep 15
          done
