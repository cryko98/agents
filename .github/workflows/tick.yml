# Keeps the crew working when nobody is watching. Every 5 minutes: one full tick, then the
# scalper every 30 seconds for the rest of the window (it needs fast price checks for its exits).
# The endpoints skip work that is not due, and a Redis lock prevents overlapping runs.
name: tick

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      SITE: https://agent-house-pied.vercel.app
      TICK_SECRET: ${{ secrets.TICK_SECRET }}
    steps:
      - name: Full tick
        run: curl -sS -m 150 -X POST "$SITE/api/tick${TICK_SECRET:+?secret=$TICK_SECRET}" | head -c 400; echo
      - name: Scalper loop (about 4.5 minutes)
        run: |
          for i in $(seq 1 9); do
            curl -sS -m 60 -X POST "$SITE/api/scalp" | head -c 300; echo
            sleep 30
          done
